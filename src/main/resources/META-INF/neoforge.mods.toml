modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
# NeoForge modId must use [a-z][a-z0-9_]{1,63}; see gradle.properties.

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="entity_model_features"
type="required"
versionRange="[3.3.9,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_texture_features"
type="required"
versionRange="[7.0.5,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_sound_features"
type="required"
versionRange="[0.8.2,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="villager-news-addon-port.mixins.json"

[[mixins]]
config="villager-news-addon-port.client.mixins.json"
